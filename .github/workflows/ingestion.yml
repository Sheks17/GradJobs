name: Scheduled employer ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: read
concurrency:
  group: gradjobs-ingestion
  cancel-in-progress: false
jobs:
  sync:
    if: vars.INGESTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT || 'GradJobs/0.2 (public job discovery)' }}
      APP_ENV: production
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Require configured database
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'INGESTION_DATABASE_URL secret is required'"
      - name: Migrate and register sources
        run: python -m alembic upgrade head && python -m collectors.seed_sources
      - name: Sync registered sources
        run: python -m collectors.sync_all --output sync-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-summary
          path: sync-summary.json
          retention-days: 14
