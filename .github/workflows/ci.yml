name: GradJobs checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gradjobs
          POSTGRES_PASSWORD: gradjobs
          POSTGRES_DB: gradjobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gradjobs -d gradjobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gradjobs:gradjobs@localhost:5432/gradjobs_test
      TEST_DATABASE_URL: postgresql+psycopg://gradjobs:gradjobs@localhost:5432/gradjobs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./artifacts/browser-test.db
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - name: Prepare isolated browser database
        run: |
          mkdir -p artifacts
          python -m alembic upgrade head
          python -m tests.seed_browser
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Run browser regression suite
        run: |
          python -m uvicorn services.api.app.main:app --host 127.0.0.1 --port 8000 > artifacts/browser-api.log 2>&1 &
          npm --prefix apps/web run start -- --hostname 127.0.0.1 --port 3000 > artifacts/browser-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          npm --prefix apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: artifacts/
          retention-days: 7
