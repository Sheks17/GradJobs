name: GradJobs checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gradjobs
          POSTGRES_PASSWORD: gradjobs
          POSTGRES_DB: gradjobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gradjobs -d gradjobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gradjobs:gradjobs@localhost:5432/gradjobs_test
      TEST_DATABASE_URL: postgresql+psycopg://gradjobs:gradjobs@localhost:5432/gradjobs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
